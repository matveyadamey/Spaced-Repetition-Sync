name: Release Obsidian plugin (BRAT)

# Создаёт GitHub Release с main.js / manifest.json / styles.css.
#
# Выпуск:
#   git tag 1.0.4 && git push origin 1.0.4

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved plugin version: ${VERSION}"

      - name: Sync and validate manifests
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 <<'PY'
          import json
          import os
          import sys

          version = os.environ["VERSION"]
          for path in ("obsidian-plugin/manifest.json", "manifest.json"):
              raw = open(path, "rb").read()
              if raw.startswith(b"\xef\xbb\xbf"):
                  print(f"ERROR: UTF-8 BOM in {path}", file=sys.stderr)
                  sys.exit(1)
              data = json.loads(raw.decode("utf-8"))
              required = ["id", "name", "version", "minAppVersion", "description"]
              missing = [k for k in required if k not in data or data[k] in ("", None)]
              if missing:
                  print(f"ERROR: {path} missing fields: {missing}", file=sys.stderr)
                  sys.exit(1)
              data["version"] = version
              # ASCII-safe JSON avoids encoding issues for some BRAT/GitHub paths
              text = json.dumps(data, ensure_ascii=True, indent=2) + "\n"
              open(path, "w", encoding="ascii", newline="\n").write(text)
              print(f"OK {path} -> version {version}, id={data['id']}")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build plugin
        working-directory: obsidian-plugin
        run: |
          npm ci
          npm run build

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release
          cp obsidian-plugin/main.js release/main.js
          cp obsidian-plugin/manifest.json release/manifest.json
          cp obsidian-plugin/styles.css release/styles.css
          python3 -c "import json; m=json.load(open('release/manifest.json')); assert m['id']=='spaced-repetition-sync'; assert m['version']=='${{ steps.version.outputs.version }}'; print(m)"
          test -s release/main.js
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
