services:
  db:
    # AWS Public ECR mirror of Docker Hub official images
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: spaced
      POSTGRES_PASSWORD: spaced
      POSTGRES_DB: spaced_repetition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaced -d spaced_repetition"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://spaced:spaced@db:5432/spaced_repetition
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
